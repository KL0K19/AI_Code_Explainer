<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI Code Explainer</title>
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background-color: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #ffffff;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #aaa;
    }
    select {
      width: 100%;
      padding: 7px;
      background-color: #2d2d2d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      outline: none;
      box-sizing: border-box;
    }
    select:focus {
      border-color: #007acc;
    }
    .hint {
      font-size: 11px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>Настройки анализа</h3>
  
  <div class="field">
    <label for="modelSelect">Модель ИИ:</label>
    <select id="modelSelect">
        <option value="gemini-3.6-flash">gemini-3.6-flash</option>
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
        <option value="gemini-3.5-flash">gemini-3.5-flash</option>
        <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
    </select>
  </div>

  <div class="field">
    <label for="langSelect">Язык ответа:</label>
    <select id="langSelect">
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="hint" id="hintText">
    • Текст: выделите код и нажмите ПКМ → «Анализировать код»<br>
    • Скриншот: нажмите <b>Ctrl+Shift+X</b><br>
    • Окно можно свободно двигать за заголовок и растягивать за любые края
  </div>

  <script src="popup.js"></script>
</body>
</html>
